name: Velse Blog CI & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './blog-app/package-lock.json'

      - name: Install dependencies
        run: |
          cd blog-app
          npm install

      - name: Build local validation
        run: |
          cd blog-app
          npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: b9672100f0694b01af6a18fc9f8009317ecbba184d01142a6855c2d5eac829c2
          GITHUB_OWNER: Gopikrishnavallepu
          GITHUB_REPO: Personal-Portfolio
          GITHUB_ID: mock-id
          GITHUB_SECRET: mock-secret

      # Optional: Deploy to Vercel via GitHub Actions (if secrets are set up)
      - name: Install Vercel CLI
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Info
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./blog-app
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts on Vercel
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./blog-app

      - name: Deploy to Vercel
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./blog-app
    env:
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
